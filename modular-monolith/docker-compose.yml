services:
  modular-monolith:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      modular-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  modular-db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5436:5432"
    volumes:
      - modular-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modular -d modular_monolith"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  modular-db-data:
