services:
  menu-service:
    build:
      context: ./menu-service
    env_file:
      - ./menu-service/.env
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  orders-service:
