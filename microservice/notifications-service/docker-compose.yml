services:
  notifications-service:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "3004:3004"
    depends_on:
      mailhog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3004/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    env_file:
      - .env
    networks:
      - default
      - snack-bar-notifications
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  snack-bar-notifications:
    name: snack-bar-notifications
