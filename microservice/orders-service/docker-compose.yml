services:
  orders-service:
    build:
      context: .
    env_file:
      - .env
    environment:
      MENU_SERVICE_URL: ${MENU_SERVICE_URL:-http://host.docker.internal:3001}
      PAYMENTS_SERVICE_URL: ${PAYMENTS_SERVICE_URL:-http://host.docker.internal:3003}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
    ports:
      - "3002:3002"
    depends_on:
      orders-db:
        condition: service_healthy
    networks:
      - default
      - snack-bar-notifications
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  orders-db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orders-db-data:

networks:
  snack-bar-notifications:
    external: true
